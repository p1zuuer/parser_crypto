<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Cluster Bot - WebApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc',
                            muted: '#94a3b8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-dark-text min-h-screen font-sans antialiased flex flex-col">
    <!-- Header -->
    <header class="bg-dark-card border-b border-dark-border px-4 py-4 flex items-center justify-between sticky top-0 z-10 shadow-md">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">📊</span>
            <h1 class="text-xl font-bold tracking-wide">Cluster Tracker</h1>
        </div>
        <div id="user-info" class="text-xs text-dark-muted bg-dark-bg px-3 py-1 rounded-full border border-dark-border">
            Loading user...
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-2xl font-semibold">Detected Clusters</h2>
                <p class="text-sm text-dark-muted mt-1">Real-time smart wallet accumulation clusters (> $10,000 volume)</p>
            </div>
            <button onclick="fetchClusters()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition duration-200 flex items-center shadow-lg shadow-indigo-500/20">
                🔄 Refresh
            </button>
        </div>

        <!-- Clusters Table Container -->
        <div class="bg-dark-card border border-dark-border rounded-xl shadow-xl overflow-hidden flex-1 flex flex-col">
            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/60 border-b border-dark-border text-xs uppercase tracking-wider text-dark-muted">
                            <th class="py-3 px-4 font-semibold">Token</th>
                            <th class="py-3 px-4 font-semibold">Network</th>
                            <th class="py-3 px-4 font-semibold">Volume (USD)</th>
                            <th class="py-3 px-4 font-semibold">Wallet Address</th>
                        </tr>
                    </thead>
                    <tbody id="clusters-table-body" class="divide-y divide-dark-border text-sm">
                        <tr>
                            <td colspan="4" class="py-8 text-center text-dark-muted">Loading clusters data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark-card border-t border-dark-border py-3 text-center text-xs text-dark-muted">
        Smart Cluster Bot &copy; 2026. All rights reserved.
    </footer>

    <script>
        // Initialize Telegram WebApp if available
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('user-info').innerText = `@${user.username || user.first_name || 'User'}`;
            } else {
                document.getElementById('user-info').innerText = 'Web Mode';
            }
        } else {
            document.getElementById('user-info').innerText = 'Browser Mode';
        }

        async function fetchClusters() {
            const tbody = document.getElementById('clusters-table-body');
            try {
                const response = await fetch('/api/clusters');
                if (!response.ok) {
                    throw new Error('Failed to fetch clusters');
                }
                const clusters = await response.json();

                if (!clusters || clusters.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-dark-muted">No cluster history found yet.</td></tr>`;
                    return;
                }

                tbody.innerHTML = clusters.map(c => `
                    <tr class="hover:bg-slate-800/40 transition duration-150">
                        <td class="py-3 px-4 font-medium flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span>${c.TokenSymbol || 'UNKNOWN'}</span>
                            <span class="text-xs text-dark-muted truncate max-w-[100px]" title="${c.TokenAddress}">${c.TokenAddress}</span>
                        </td>
                        <td class="py-3 px-4">
                            <span class="px-2.5 py-1 text-xs rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${c.Chain || 'Ethereum'}</span>
                        </td>
                        <td class="py-3 px-4 font-semibold text-emerald-400">
                            $${Number(c.TotalVolumeUSD || c.AmountUSD || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                        </td>
                        <td class="py-3 px-4 font-mono text-xs text-dark-muted truncate max-w-[150px]" title="${c.WalletAddress || c.TokenAddress}">
                            ${c.WalletAddress || '0x...'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-red-400">Error loading cluster data. Please retry.</td></tr>`;
            }
        }

        // Fetch on load and every 10 seconds
        fetchClusters();
        setInterval(fetchClusters, 10000);
    </script>
</body>
</html>
